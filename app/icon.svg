<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle drop shadow on the squircle -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#16143E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean App Squircle Container -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="108"
    fill="#FFFFFF"
    stroke="#16143E"
    stroke-opacity="0.08"
    stroke-width="6"
    filter="url(#shadow)"
  />

  <!-- Broadnet Signal Broadcast Transmission System -->
  <g transform="translate(256, 256) scale(2.8)">
    <!-- Central Tower Mast -->
    <rect x="-5" y="8" width="10" height="42" rx="2" fill="#4E0DBA" />

    <!-- Left Arcs (Radiating Waves) -->
    <!-- Inner Left Arc -->
    <path
      d="M -14 0 A 18 18 0 0 0 -14 26"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <!-- Mid Left Arc -->
    <path
      d="M -26 -10 A 32 32 0 0 0 -26 36"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Outer Left Arc -->
    <path
      d="M -38 -20 A 46 46 0 0 0 -38 46"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- Right Arcs (Radiating Waves) -->
    <!-- Inner Right Arc -->
    <path
      d="M 14 0 A 18 18 0 0 1 14 26"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <!-- Mid Right Arc -->
    <path
      d="M 26 -10 A 32 32 0 0 1 26 36"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Outer Right Arc -->
    <path
      d="M 38 -20 A 46 46 0 0 1 38 46"
      fill="none"
      stroke="#4E0DBA"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- Central Signal Beacon (Broadnet Crimson Red) -->
    <circle cx="0" cy="8" r="8" fill="#EF1313" />
    <circle cx="0" cy="8" r="4" fill="#FFFFFF" fill-opacity="0.4" />
  </g>
</svg>
